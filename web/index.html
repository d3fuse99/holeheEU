<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holehe Web OSINT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="text-zinc-200 font-sans min-h-screen selection:bg-indigo-500 selection:text-white antialiased">
    <div id="theme-overlay" class="fixed pointer-events-none rounded-full z-0" style="width: 10px; height: 10px; transform: translate(-50%, -50%) scale(0); left: 0; top: 0;"></div>
    
    <div class="max-w-7xl mx-auto px-4 py-8 relative z-10">
        
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-zinc-900 pb-6 mb-8 gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-black tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-500 bg-clip-text text-transparent flex items-center gap-3">
                    <i class="fa-solid fa-circle-nodes animate-pulse"></i> 
                    <span data-i18n="title">Holehe: EU/CIS OSINT Web</span>
                </h1>
            </div>
            
            <div class="flex items-center gap-4 flex-wrap">
                <div class="theme-slider-container" id="theme-slider-container">
                    <div class="sky-layer sky-layer--day" id="sky-day">
                        <span class="sky-clouds" id="sky-cloud-1"><i class="fa-solid fa-cloud"></i></span>
                        <span class="sky-clouds" id="sky-cloud-2"><i class="fa-solid fa-cloud"></i></span>
                    </div>
                    <div class="sky-layer sky-layer--night" id="sky-night">
                        <div class="theme-switch__aurora" id="aurora-sky"></div>
                        <span class="sky-stars animate-pulse"><i class="fa-solid fa-star"></i></span>
                    </div>
                    <input type="range" id="theme-slider" min="0" max="100" value="100" oninput="updateTheme(this.value)" class="custom-slider">
                </div>

                <div class="flex bg-zinc-950 p-1 rounded-xl border border-zinc-900">
                    <button id="btn-ru" onclick="switchLanguage('ru')" class="px-3 py-1 text-xs font-black rounded-lg bg-indigo-600 text-white transition-all duration-300">RU</button>
                    <button id="btn-en" onclick="switchLanguage('en')" class="px-3 py-1 text-xs font-black rounded-lg bg-transparent text-zinc-500 hover:bg-zinc-900 hover:text-zinc-300 transition-all duration-300">EN</button>
                </div>
            </div>
        </div>

        <div class="bg-zinc-950/40 border border-zinc-900 p-6 sm:p-8 rounded-3xl mb-8">
            <div class="flex flex-col sm:flex-row gap-4 items-center justify-between">
                <div class="w-full flex-1 relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-zinc-500 pointer-events-none">
                        <i class="fa-solid fa-envelope text-sm"></i>
                    </span>
                    <input type="email" id="email-input" oninput="handleEmailInput(this.value)" data-i18n="inputPlaceholder" placeholder="Введите почту..." 
                           class="w-full cyber-input text-zinc-100 pl-12 pr-32 py-3.5 rounded-2xl focus:outline-none text-base">
                    
                    <div id="domain-badge" class="absolute inset-y-0 right-3 flex items-center px-3 py-1 my-auto h-7 text-[11px] font-bold rounded-lg bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 hidden transition-all duration-200 pointer-events-none"></div>
                </div>
                
                <div class="w-full sm:w-auto flex justify-end shrink-0">
                    <button onclick="startScan()" id="scan-btn" class="button w-full sm:w-auto">
                        <div class="outline"></div>
                        <div class="state state--default">
                            <div class="icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M21 3L3 10.5L11.5 13L14 21.5L21 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                            <p></p>
                        </div>
                        <div class="state state--sent">
                            <div class="icon">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
                                </svg>
                            </div>
                            <p></p>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <div id="loading-container" class="hidden flex flex-col items-center justify-center py-12">
            <div class="loader">
                <div class="text"><span>LOADING</span></div>
                <div class="text"><span>LOADING</span></div>
                <div class="text"><span>LOADING</span></div>
                <div class="text"><span>LOADING</span></div>
                <div class="text"><span>LOADING</span></div>
                <div class="text"><span>LOADING</span></div>
                <div class="text"><span>LOADING</span></div>
                <div class="text"><span>LOADING</span></div>
                <div class="text"><span>LOADING</span></div>
                <div class="line"></div>
            </div>
            <div id="loader-status" class="mt-6 text-sm font-bold text-indigo-400 font-mono text-center"></div>
        </div>

        <div id="stats-section" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 hidden">
            <div onclick="filterResults('all')" class="bg-zinc-950 border border-zinc-900 p-5 rounded-2xl cursor-pointer hover:border-indigo-500/50 hover:bg-zinc-900/50 transition-all duration-200">
                <div class="text-xs font-bold text-zinc-500 tracking-wider uppercase" data-i18n="statChecked">Проверено</div>
                <div id="stat-checked" class="text-3xl font-black mt-2 text-zinc-100">0</div>
            </div>
            <div onclick="filterResults('EXISTS')" class="bg-zinc-950 border border-zinc-900 p-5 rounded-2xl cursor-pointer hover:border-emerald-500/50 hover:bg-zinc-900/50 transition-all duration-200">
                <div class="text-xs font-bold text-zinc-500 tracking-wider uppercase text-emerald-500" data-i18n="statFound">Найдено</div>
                <div id="stat-found" class="text-3xl font-black mt-2 text-emerald-500">0</div>
            </div>
            <div onclick="filterResults('not found')" class="bg-zinc-950 border border-zinc-900 p-5 rounded-2xl cursor-pointer hover:border-zinc-700 hover:bg-zinc-900/50 transition-all duration-200">
                <div class="text-xs font-bold text-zinc-500 tracking-wider uppercase text-zinc-400" data-i18n="statNotFound">Не найдено</div>
                <div id="stat-notfound" class="text-3xl font-black mt-2 text-zinc-400">0</div>
            </div>
            <div onclick="filterResults('LIMIT')" class="bg-zinc-950 border border-zinc-900 p-5 rounded-2xl cursor-pointer hover:border-amber-500/50 hover:bg-zinc-900/50 transition-all duration-200">
                <div class="text-xs font-bold text-zinc-500 tracking-wider uppercase text-amber-500" data-i18n="statLimit">Лимиты</div>
                <div id="stat-limit" class="text-3xl font-black mt-2 text-amber-500">0</div>
            </div>
        </div>

        <div id="results-controls" class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6 hidden">
            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="filterResults('all')" id="filter-btn-all" class="filter-tab px-3.5 py-1.5 text-xs font-bold rounded-xl bg-indigo-600 text-white transition-all duration-200" data-i18n="filterAll">Все</button>
                <button onclick="filterResults('EXISTS')" id="filter-btn-EXISTS" class="filter-tab px-3.5 py-1.5 text-xs font-bold rounded-xl bg-zinc-900 border border-zinc-800 text-emerald-400 hover:border-emerald-500/50 transition-all duration-200" data-i18n="filterFound">Найденные</button>
                <button onclick="filterResults('not found')" id="filter-btn-notfound" class="filter-tab px-3.5 py-1.5 text-xs font-bold rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:border-zinc-700 transition-all duration-200" data-i18n="filterNotFound">Не найденные</button>
                <button onclick="filterResults('LIMIT')" id="filter-btn-LIMIT" class="filter-tab px-3.5 py-1.5 text-xs font-bold rounded-xl bg-zinc-900 border border-zinc-800 text-amber-400 hover:border-amber-500/50 transition-all duration-200" data-i18n="filterLimit">Лимиты</button>
            </div>
            <div class="flex items-center gap-3 flex-wrap sm:flex-nowrap">
                <div class="relative w-full sm:w-56">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-zinc-500 pointer-events-none">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="search-cards-input" oninput="searchCards()" data-i18n="searchPlaceholder" placeholder="Поиск сервиса..." 
                           class="w-full cyber-input text-xs text-zinc-100 pl-9 pr-3 py-2 rounded-xl focus:outline-none">
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button id="copy-btn" onclick="copyFoundResults()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-zinc-950 border border-zinc-900 text-emerald-400 hover:border-emerald-500/50 transition-all duration-300 hidden" data-i18n="copyBtn">Скопировать</button>
                    <button id="download-btn" onclick="downloadResults()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-zinc-950 border border-zinc-900 text-indigo-400 hover:border-indigo-500/50 transition-all duration-300 hidden" data-i18n="downloadBtn">Экспорт .TXT</button>
                    <button id="download-json-btn" onclick="downloadResultsJson()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-zinc-950 border border-zinc-900 text-purple-400 hover:border-purple-500/50 transition-all duration-300 hidden" data-i18n="downloadJsonBtn">Экспорт .JSON</button>
                </div>
            </div>
        </div>

        <div id="results-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-zinc-900 border border-indigo-500/40 text-zinc-100 px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none">
        <div class="w-8 h-8 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-sm">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toast-message" class="text-xs font-bold"></span>
    </div>

    <script src="/static/translations.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
